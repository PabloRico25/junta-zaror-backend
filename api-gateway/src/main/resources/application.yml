server:
  port: 9090

spring:
  config:
    import: optional:file:.env[.properties]

  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:9094
          predicates:
            - Path=/auth/**,/usuarios/**

        - id: reserva-service
          uri: http://localhost:9092
          predicates:
            - Path=/dependencias/**,/reservas/**,/accesos/**

        - id: pago-service
          uri: http://localhost:9095
          predicates:
            - Path=/pagos/**
