server:
  port: 9090

spring:
  config:
    import: optional:file:.env[.properties]

  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

  cloud:
    gateway:
      # Tiempos del cliente que el gateway usa para llamar a los servicios:
      # una conexión ociosa se descarta a los 5 s (Tomcat las cierra a los 20 s) y, si un servicio
      # no contesta, el gateway falla en segundos en vez de quedarse esperando para siempre.
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
        pool:
          max-idle-time: 5s
      routes:

        - id: auth-service
          uri: http://localhost:9094
          predicates:
            - Path=/auth/**,/usuarios/**

        - id: reserva-service
          uri: http://localhost:9092
          predicates:
            - Path=/dependencias/**,/reservas/**,/accesos/**

        - id: pago-service
          uri: http://localhost:9095
          predicates:
            - Path=/pagos/**