spring.application.name=pago
server.port=9095
server.address=127.0.0.1
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jz_pagos}
spring.datasource.username=${DB_USER:jz_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET}
api.base-url=http://localhost:9090
api.reserva.confirmada=/reservas/%d/confirmada
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never